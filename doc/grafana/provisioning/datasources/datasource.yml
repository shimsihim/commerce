# ==========================================
# Grafana Data Source Provisioning
# ==========================================
# Grafana 컨테이너 시작 시 자동으로 InfluxDB를 데이터소스로 등록
# Spring Actuator 메트릭을 바로 시각화 가능

apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy                          # Grafana 서버를 통해 접근 (브라우저 직접 접근 X)
    uid: gxsz4j
    url: http://influxdb:8086              # Docker 네트워크 내부 hostname
    database: appmetrics                   # Spring Actuator 메트릭이 저장되는 데이터베이스
    isDefault: true                        # 기본 데이터소스로 설정

    # InfluxDB 2.x (Flux) 필수 설정
    jsonData:
      version: Flux
      organization: my-org       # docker-compose의 INIT_ORG와 일치
      defaultBucket: my-bucket   # docker-compose의 INIT_BUCKET과 일치
      tlsSkipVerify: true        # http 통신이므로 SSL 검증 건너뛰기

    # 비밀번호(Token) 설정
    secureJsonData:
      # docker-compose의 INIT_ADMIN_TOKEN과 일치해야 함
      token: my-super-secret-token

    editable: true                         # Grafana UI에서 수정 가능
