management:
  metrics:
    export:
      influx:
        token: "my-real-super-secret-token-value"
        uri: "http://localhost:8086" # 로컬 개발용 주소
        bucket: "my-bucket"
        org: "my-org"

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:commerce}?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver