spring:
  application.name: hhplus-e-commerce
  config:
    import:
      - application-secret.yml

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        # ==========================================
        # DDL 자동 생성 모드 (환경변수로 제어)
        # ==========================================
        # 로컬: validate (schema.sql 사용)
        # 개발: validate
        # 운영: validate 또는 none
        hbm2ddl:
          auto: ${JPA_DDL_AUTO:none}
    jpa-auditing:
      enabled: true

#  # ==========================================
#  # Redis Configuration (환경변수 우선)
#  # ==========================================
#  data:
#    redis:
#      host: ${REDIS_HOST:127.0.0.1}
#      port: ${REDIS_PORT:6379}
#  cache:
#    type: redis

  # ==========================================
  # Kafka Configuration (환경변수 우선)
  # ==========================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}


# ==========================================
# P6Spy SQL Logging
# ==========================================
#decorator:
#  datasource:
#    p6spy:
#      enable-logging: ${P6SPY_ENABLE:true}

# ==========================================
# Logging Configuration
# ==========================================
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    io.hhplus.tdd: ${LOG_LEVEL_APP:DEBUG}

# ==========================================
# Metrics Configuration
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus  # Actuator 엔드포인트 노출

  metrics:
    export:
      influx:
        enabled: true  # Influx export 활성화

    # 메트릭 태그 추가
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:dev}  # 환경 구분 (dev, prod 등)

    # 메트릭 활성화
    enable:
      jvm: true
      process: true
      system: true
      tomcat: true
      logback: true
      hikaricp: true  # DB 사용 시

    # 분포 메트릭 설정 (응답시간 percentile)
    distribution:
      percentiles-histogram:
        http.server.requests: true  # HTTP 요청 히스토그램
      slo:
        http.server.requests:  # SLO 정의
          - 10ms
          - 50ms
          - 100ms
          - 200ms
          - 500ms
          - 1s
          - 2s
      percentiles:
        http.server.requests: 0.5,0.95,0.99  # 50%, 95%, 99% percentile

# ==========================================
# 환경별 설정 방법
# ==========================================
# 1. 로컬 개발 (기본값):
#    - 환경변수 없이 실행하면 localhost 사용
#    - ./gradlew bootRun
#
# 2. Docker Compose 환경:
#    - DB_HOST=mysql
#    - REDIS_HOST=redis
#    - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
#    - JPA_DDL_AUTO=validate
#
# 3. 개발/운영 환경:
#    - 시스템 환경변수로 설정
#    - 예: export DB_URL=jdbc:mysql://prod-db:3306/commerce
#    - 또는 JAR 실행 시: java -jar app.jar --DB_HOST=prod-db
#
# 4. Spring Profile 사용:
#    - application-dev.yml, application-prod.yml 생성
#    - --spring.profiles.active=dev 로 실행
